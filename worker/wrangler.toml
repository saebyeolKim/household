name = "household-ledger-api"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "household-ledger"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[vars]
ALLOWED_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"
# PIN은 여기 쓰지 말고 `wrangler secret put PIN` 으로 등록하세요
